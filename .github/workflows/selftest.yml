name: selftest
on:
  push:
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the record-race smoke prepares a pass over HEAD~1..HEAD — real history required
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev dependencies (complexity-gate's optional TypeScript peer)
        run: npm ci
      - name: Five tool self-tests + the live gate verdicts (refusals included)
        run: npm run selftest
      - name: Lifecycle smoke (a task can travel intake to done, and the refusals fire)
        run: |
          set -e
          node tools/task-state.mjs new smoke --risk-class planning-only
          node tools/task-state.mjs advance smoke planned
          if node tools/task-state.mjs advance smoke executing; then
            echo "planning-only reached executing: the gate is decoration"; exit 1
          fi
          echo "refusal fired: planning-only cannot execute"
      - name: Concurrent-writers smoke (no silent lost appends)
        run: |
          set -e
          node tools/task-state.mjs new smoke-race --risk-class runtime-code
          for i in 1 2 3 4 5 6 7 8; do
            node tools/task-state.mjs red-check smoke-race --evidence README.md &
          done
          wait
          COUNT=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('tasks/smoke-race.json','utf8')).events.filter(e => e.type === 'red-check').length)")
          echo "red-check events survived: $COUNT/8"
          test "$COUNT" = "8"
      - name: Concurrent record smoke (the original lost-finding bug)
        run: |
          set -e
          node tools/task-state.mjs new smoke-finding --risk-class runtime-code
          node tools/adversarial-runner.mjs prepare smoke-finding
          for i in 1 2 3 4 5 6; do
            node tools/adversarial-runner.mjs record smoke-finding --lane 1 --severity LOW --claim "concurrent writer $i" &
          done
          wait
          COUNT=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('tasks/smoke-finding.findings.json','utf8')).findings.length)")
          echo "findings survived: $COUNT/6"
          test "$COUNT" = "6"
      - name: Commit-msg binding smoke (footer must name an in-flight, scoped task)
        run: |
          set -e
          echo "export {}" > tools/scratch-probe.mjs
          git add tools/scratch-probe.mjs
          printf 'feat: probe\ntask: no-such-task\n' > /tmp/probe-msg
          if node tools/task-coverage.mjs --commit-msg /tmp/probe-msg; then
            echo "commit-msg gate accepted an unknown task: the gate is decoration"; exit 1
          fi
          echo "refusal fired: unknown task refused at commit time"
          node tools/task-state.mjs new smoke-bind --risk-class runtime-code
          node tools/task-state.mjs advance smoke-bind planned
          node tools/task-state.mjs advance smoke-bind executing
          printf 'feat: probe\ntask: smoke-bind\n' > /tmp/probe-msg
          if node tools/task-coverage.mjs --commit-msg /tmp/probe-msg; then
            echo "commit-msg gate accepted an unscoped post-cutover task: the gate is decoration"; exit 1
          fi
          echo "refusal fired: post-cutover task with no declared scope"
          node tools/task-state.mjs scope smoke-bind --add "tools/scratch-*.mjs"
          node tools/task-coverage.mjs --commit-msg /tmp/probe-msg
          echo "pass fired: scoped in-flight task accepted"
          printf '\n' >> tools/task-coverage.mjs
          git add tools/task-coverage.mjs
          if node tools/task-coverage.mjs --commit-msg /tmp/probe-msg; then
            echo "commit-msg gate accepted code outside the declared scope: the gate is decoration"; exit 1
          fi
          echo "refusal fired: code outside the declared scope"
          git reset -q -- tools/scratch-probe.mjs tools/task-coverage.mjs
          git checkout -q -- tools/task-coverage.mjs
          rm -f tools/scratch-probe.mjs /tmp/probe-msg tasks/smoke-bind.json
      - name: Committed adoption base resolves with no --base and no local config
        run: node tools/task-coverage.mjs
      - name: Wiring doctor (the fence checks itself)
        if: github.event_name == 'push'
        run: node tools/task-coverage.mjs --doctor
      - name: Task coverage (push-range fence; adoption base grandfathers history)
        if: github.event_name == 'push'
        run: |
          BASE="${{ github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            node tools/task-coverage.mjs
          else
            node tools/task-coverage.mjs --base "$BASE"
          fi
